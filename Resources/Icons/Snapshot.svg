<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Snapshot's icon: four cards, glossy blue like the other header icons -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a8cff"/>
      <stop offset="0.5" stop-color="#1f4dff"/>
      <stop offset="1" stop-color="#0a24c8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="url(#tile)" stroke="#0a1e9c" stroke-width="1.5">
    <rect x="6" y="6" width="23" height="30" rx="5"/>
    <rect x="35" y="6" width="23" height="18" rx="5"/>
    <rect x="6" y="42" width="23" height="16" rx="5"/>
    <rect x="35" y="30" width="23" height="28" rx="5"/>
  </g>
  <g fill="url(#shine)">
    <rect x="9" y="8" width="17" height="10" rx="4"/>
    <rect x="38" y="8" width="17" height="7" rx="3"/>
    <rect x="9" y="44" width="17" height="6" rx="3"/>
    <rect x="38" y="32" width="17" height="9" rx="4"/>
  </g>
</svg>
