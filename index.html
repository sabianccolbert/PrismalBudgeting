<!DOCTYPE html>
<html lang="en" class="noJs">
  <head>
    <script src="/Javascript/Boot.js"></script>
    <link rel="stylesheet" href="/stylesheet.css">
    <link rel="stylesheet" href="/budgetStyle.css">
    <title>Prismal Budget - Home</title>
    <meta name="description" content="Prismal Budget is a modern budget that offers the features no other budget does.">
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Prismal" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph / Social Media Preview Cards -->
    <meta property="og:title" content="Prismal Budget - Home">
    <meta property="og:description" content="Prismal Budget is a modern budget that offers the features no other budget does.">
    <meta property="og:image" content="https://prismalbudget.org/Favicon/og-image.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prismalbudget.org">
    <!-- Modern Favicons -->
    <link rel="icon" type="image/png" href="/Favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/Favicon/favicon.svg" />
    <link rel="shortcut icon" href="/Favicon/favicon.ico" />

    <!-- Apple Touch Icon (iOS Home Screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Favicon/apple-touch-icon.png" />


    <!-- Web App Manifest (Android Home Screen / PWA) -->
    <link rel="manifest" href="/Favicon/site.webmanifest" />
  </head>
  <body>
    <canvas id="constellations"></canvas>
    <div id="transitionContainer">
      
      <header>
        <div class="brand">
          <img src="/Resources/Prismal.png" alt="Prismal Logo" class="brand-icon">
          <h2 class="logo">Prismal Budget</h2>
        </div>
        
        <nav class="navButtons">
          <a href="/menu">
            <img src="/Resources/Menu.png" alt="Menu">
          </a>
          <a href="/settings.html">
            <img src="/Resources/Settings.png" alt="Settings">
          </a>
          <a id="logoutButton" href="logout">
            <img src="/Resources/Logout.png" alt="Logout">
          </a>
        </nav>
      </header>
      <hr>
      <main>
        <section class="searchBar" aria-label="Search entries">
          <form id="searchForm" autocomplete="off">
            <input id="searchAliases" type="text" placeholder="Search: rent, paycheck+, car stuff=" aria-label="Search entries">
            <input id="searchFrom" class="dateInput" type="text" inputmode="numeric" placeholder="From MM/DD/YYYY" aria-label="From date" data-next-pick="searchTo">
            <input id="searchTo" class="dateInput" type="text" inputmode="numeric" placeholder="To MM/DD/YYYY" aria-label="To date">
            <button type="submit" class="budgetButton primary">Search</button>
          </form>
          <div id="searchResults" class="searchResults" hidden></div>
        </section>

        <section class="infoRow">
          <div class="infoCard lowestCard">
            <span class="infoLabel">Lowest in bank after today</span>
            <span id="lowestAmount" class="lowestAmount">--</span>
          </div>
          <div class="infoCard daveCard">
            <!-- Dave's image: set src once it's ready -->
            <img class="daveImage" alt="Dave">
            <p id="daveMessage" class="daveMessage">Loading...</p>
          </div>
          <div class="infoCard upcomingCard">
            <span class="infoLabel">Upcoming</span>
            <ul id="upcomingList" class="upcomingList"></ul>
          </div>
        </section>

        <div class="calendarToolbar">
          <!-- New entry button image: set src once it's ready -->
          <button id="addEntryButton" class="imageButton" type="button"><img alt="New Entry"></button>
        </div>
        <div id="panelSlot"></div>

        <article>
          <table class="elastic-table">
            <tbody>
              <!-- 4 Rows -->
              <tr>
                <!-- 7 Columns per row (wrapped content for hit-box isolation) -->
                <td><div class="cell-content">Data Loading Failed</div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
              </tr>
              <tr>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
              </tr>
              <tr>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
              </tr>
              <tr>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
                <td><div class="cell-content"></div></td>
              </tr>
            </tbody>
          </table>
        </article>
      </main>
    </div>
  </body>
</html>
