<!DOCTYPE html>
<html lang="en" class="noJs">
  <head>
    <meta charset="UTF-8">
    <!-- First, before anything loads: no request from this page says its address (a reset link's carries
         its code until Login.js takes it out) -->
    <meta name="referrer" content="no-referrer">
    <script src="/Javascript/Boot.js"></script>
    <link rel="stylesheet" href="/stylesheet.css?v=10.06.2026.A">
    <link rel="preload" href="/Fonts/MainFont-Latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>Prismal Budget - Login</title>
    <meta name="description" content="Prismal Budget is a modern budget that offers the features no other budget does.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Prismal Login" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph / Social Media Preview Cards -->
    <meta property="og:title" content="Prismal Budget - Login">
    <meta property="og:description" content="Prismal Budget is a modern budget that offers the features no other budget does.">
    <meta property="og:image" content="https://prismalbudget.org/Favicon/og-image.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prismalbudget.org">
    <!-- Modern Favicons -->
    <link rel="icon" type="image/png" href="/Favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/Favicon/favicon.svg" />
    <link rel="shortcut icon" href="/Favicon/favicon.ico" />

    <!-- Apple Touch Icon (iOS Home Screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Favicon/apple-touch-icon.png" />


    <!-- Web App Manifest (Android Home Screen / PWA) -->
    <link rel="manifest" href="/Favicon/site.webmanifest" />
  </head>
  <body>
    <canvas id="constellations"></canvas>
    <div id="transitionContainer">
      <header>
        <div class="brand">
          <img src="/Resources/Prismal.webp" alt="Prismal Logo" class="brand-icon">
          <h2 class="logo">Sign In To Prismal Budget</h2>
        </div>
      </header>
      <main>
        <article>
          <!-- Login.js shows the groups each mode needs: login, create, forgot, reset -->
          <form id="auth-form">
            <p id="form-hint" class="formHint hidden"></p>

            <div id="username-group">
              <label for="username" id="username-label">Username or Email</label>
              <!-- "webauthn": browsers with passkey autofill list the site's passkeys here -->
              <input type="text" id="username" required autocomplete="username webauthn">
            </div>

            <div id="email-group" class="hidden">
              <label for="email">Email</label>
              <input type="email" id="email" required autocomplete="email" disabled>
            </div>

            <div id="password-group">
              <label for="password" id="password-label">Password</label>
              <input type="password" id="password" required autocomplete="current-password">
            </div>

            <div id="verify-password-group" class="hidden">
              <label for="verify-password">Verify Password</label>
              <input type="password" id="verify-password" required autocomplete="new-password" disabled>
            </div>

            <label id="terms-group" class="termsField hidden">
              <input type="checkbox" id="agree-terms" required disabled>
              <span>I agree to the <a href="/privacy and terms.html" target="_blank">Privacy Policy & Terms of Use</a></span>
            </label>

            <!-- Login: make a passkey for this device right after signing in (Login.js names its check, like Face ID) -->
            <label id="passkey-group" class="termsField hidden">
              <input type="checkbox" id="turn-on-passkey" disabled>
              <span id="passkey-label">Turn on passkey sign-in</span>
            </label>

            <p id="status-message" role="status"></p>

            <button type="submit" id="primary-action-btn">Login</button>
            <button type="button" id="passkey-btn" class="hidden">Sign In With A Passkey</button>
            <button type="button" id="toggle-mode-btn">New Account?</button>
            <button type="button" id="forgot-btn" class="textButton">Forgot Password?</button>
          </form>
        </article>
      </main>
    </div>
  </body>
</html>
