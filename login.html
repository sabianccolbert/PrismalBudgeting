<!DOCTYPE html>
<html lang="en" class="noJs">
  <head>
    <link rel="preload" as="image" href="/Resources/Background.webp">
    <script src="/Javascript/Boot.js"></script>
    <noscript>
      <link rel="stylesheet" href="/stylesheet.css">
    </noscript>
    <title>Prismal Budget - Login</title>
    <meta name="description" content="Prismal Budget is a modern budget that offers the features no other budget does.">
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    
    <style>
      #constellations {
        background-image: url("/Resources/Background.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>

    <!-- Open Graph / Social Media Preview Cards -->
    <meta property="og:title" content="Prismal Budget - Login">
    <meta property="og:description" content="Prismal Budget is a modern budget that offers the features no other budget does.">
    <meta property="og:image" content="https://prismalbudget.org/Favicon/og-image.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://prismalbudget.org">

    <!-- Modern Favicons -->
    <link rel="icon" type="image/png" href="/Favicon/favicon-96x96.png?v=20260922" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/Favicon/favicon.svg?v=20260922" />
    <link rel="shortcut icon" href="/Favicon/favicon.ico?v=20260922" />

    <!-- Apple Touch Icon (iOS Home Screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Favicon/apple-touch-icon.png?v=20260922" />

    <!-- Web App Manifest (Android Home Screen / PWA) -->
    <link rel="manifest" href="/Favicon/site.webmanifest?v=20260922" />
    <meta name="theme-color" content="#000000">
  </head>
  <body>
    <canvas id="constellations"></canvas>
    <div id="transitionContainer">
      <header>
        <h1>Login</h1>
        <h2>Prismal Budget</h2>
        <hr>
      </header>
      <main>
        <article>
          <form id="auth-form">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username">
      
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
      
            <!-- Starts hidden with the .hidden class -->
            <div id="verify-password-group" class="hidden" style="width: 100%;">
              <label for="verify-password">Verify Password</label>
              <input type="password" id="verify-password" autocomplete="new-password">
            </div>
      
            <p id="status-message" style="color: var(--LINK_LIGHT); font-size: 4vmin; min-height: 5vmin; margin: 2vmin 0;"></p>
      
            <button type="submit" id="primary-action-btn">Login</button>
            <button type="button" id="toggle-mode-btn">New Account?</button>
          </form>
        </article>
      </main>
    </div>
    <script src="/Javascript/Login.js"></script>
  </body>
</html>
